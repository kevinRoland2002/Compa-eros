name: Build Android APK

on:
  push:
    branches: [ main, master ] # Se ejecutará en main o master automáticamente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm' # Agregamos caché para acelerar futuras compilaciones

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm ci # Usa 'npm ci' que es más estricto y limpio para servidores de integración continua

    - name: Build Web App (Vite)
      run: npm run build

    - name: Capacitor Sync
      run: npx --no-install cap sync # Forzamos a npx a usar el paquete ya instalado localmente

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
